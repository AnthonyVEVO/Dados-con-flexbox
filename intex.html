
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados con Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h2>Cinco caras de un Dado</h2>

        <div class="dados">

            <!-- Dado 1 -->
            <div class="cara cara1">
                <div class="punto"></div>
            </div>

            <!-- Dado 2 -->
            <div class="cara cara2">
                <div class="fila">
                    <div class="punto"></div>
                </div>
                <div class="fila">
                    <div class="punto"></div>
                </div>
            </div>

            <!-- Dado 3 -->
            <div class="cara cara3">
                <div class="fila">
                    <div class="punto"></div>
                </div>
                <div class="fila centro">
                    <div class="punto"></div>
                </div>
                <div class="fila derecha">
                    <div class="punto"></div>
                </div>
            </div>

            <!-- Dado 4 -->
            <div class="cara cara4">
                <div class="fila">
                    <div class="punto"></div>
                    <div class="punto"></div>
                </div>
                <div class="fila">
                    <div class="punto"></div>
                    <div class="punto"></div>
                </div>
            </div>

            <!-- Dado 5 -->
            <div class="cara cara5">
                <div class="fila">
                    <div class="punto"></div>
                    <div class="punto"></div>
                </div>
                <div class="fila centro">
                    <div class="punto"></div>
                </div>
                <div class="fila">
                    <div class="punto"></div>
                    <div class="punto"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
